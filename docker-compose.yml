# Dev environment. SQLite runs in-process in the api container — no db service.
# NOTE (skeleton): `dev-server.mjs`, `/health`, and persistence paths are created by
# the tasks that bootstrap the api/web; adjust commands/details to match the code.
services:
  api:
    image: node:20-alpine
    working_dir: /app
    command: node --watch src/dev-server.mjs
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (see .env.example)}
      DATABASE_PATH: ${DATABASE_PATH:-/data/app.db}
    volumes:
      - ./apps/api:/app
      - data:/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  web:
    image: node:20-alpine
    working_dir: /app
    command: node src/dev-server.mjs
    environment:
      WEB_PORT: ${WEB_PORT:-5173}
      API_HOST: api
      API_PORT: ${PORT:-3000}
    volumes:
      - ./apps/web:/app
    ports:
      - '${WEB_PORT:-5173}:5173'
    depends_on:
      api:
        condition: service_healthy

volumes:
  data:
