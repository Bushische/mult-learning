# Dev environment. SQLite runs in-process in the api container — no db service.
#
# The sources are mounted from the repo root (hot reload). `node_modules` are
# masked with named volumes: the host ones are macOS builds (better-sqlite3) and
# would not load inside the Linux containers. The named volumes keep the
# container dependencies between restarts.
services:
  api:
    image: node:22-alpine
    working_dir: /app/apps/api
    command: sh -c "npm i -g pnpm@9.12.0 >/dev/null 2>&1 && pnpm install --prefer-offline && pnpm --filter @mult/shared build && node src/dev-server.mjs"
    environment:
      npm_config_store_dir: /root/.pnpm-store
      NODE_ENV: ${NODE_ENV:-development}
      HOST: 0.0.0.0
      PORT: ${PORT:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (see .env.example)}
      DATABASE_PATH: ${DATABASE_PATH:-/data/app.db}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    volumes:
      - .:/app
      - data:/data
      - api_node_modules:/app/node_modules
      - api_local_modules:/app/apps/api/node_modules
      - shared_local_modules:/app/packages/shared/node_modules
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  web:
    image: node:22-alpine
    working_dir: /app/apps/web
    command: sh -c "npm i -g pnpm@9.12.0 >/dev/null 2>&1 && pnpm install --prefer-offline && node src/dev-server.mjs"
    environment:
      npm_config_store_dir: /root/.pnpm-store
      WEB_PORT: ${WEB_PORT:-5173}
      API_HOST: api
      API_PORT: ${PORT:-3000}
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
      - web_local_modules:/app/apps/web/node_modules
      - shared_local_modules:/app/packages/shared/node_modules
    ports:
      - '${WEB_PORT:-5173}:${WEB_PORT:-5173}'
    depends_on:
      api:
        condition: service_healthy

volumes:
  data:
  api_node_modules:
  api_local_modules:
  web_local_modules:
  shared_local_modules:
